track: a-soft-roce
scenario: k8s-multus-net1
description: >-
  A Multus secondary IP network beside Cilium. Two ordinary pods on different workers get eth0 from Cilium and net1, a
  macvlan child of the lab NIC with a cluster-wide Whereabouts address from the inventory's Multus pool. The run checks both
  networks across nodes, the default route, address bookkeeping when the pods are recreated, the CNI layout of every node,
  and a pod created on a worker right after its boot, before Multus writes its file, which must wait and then start with
  net1. net1 is an IP network only. It shows no RDMA device, provider or permission inside a pod.
required: true
result_kind: software-cluster-test
security:
  privileged: false
  device_exposure: >-
    The test pods are unprivileged busybox containers admitted at the PodSecurity restricted level, with no host path, host
    network or device. kubectl runs on the first control plane with its admin.conf, which never leaves that guest. tcpdump,
    the reboot and process cleanup use sudo on the workers.
checks:
  - id: cni-dir-holds-only-multus
    description: >-
      On every node Multus's 00-multus.conf is the only CNI file in /etc/cni/net.d, the directory containerd reads. Its
      clusterNetwork names 05-cilium.conflist in the cni.confPath of the Cilium values, and that file runs cilium-cni.
  - id: network-attachment-from-inventory
    description: >-
      The NetworkAttachmentDefinition in the inventory's lab namespace names the workers' lab_rdma_nic as master and the
      inventory's Multus pool as its Whereabouts range.
  - id: test-pods-ready
    description: The server and client pods run Ready on their two workers in the lab namespace at the PodSecurity restricted level.
  - id: pods-have-eth0-and-net1
    description: >-
      Each pod has eth0 from Cilium inside its node's pod CIDR and net1 from the attachment inside the pool, the same addresses
      in the Multus network status and inside the pod.
  - id: default-route-on-eth0
    description: >-
      Each pod has exactly one default route, through eth0, and sends the node address of the first control plane, which
      lies off both pod networks, through eth0.
  - id: eth0-cross-node
    description: The client fetches the server pod's name over HTTP from the server's eth0 address on the other worker.
  - id: net1-cross-node
    description: The client routes the server's net1 address through net1 and fetches the server pod's name over HTTP from it.
  - id: net1-on-lab-nic
    description: Lab NIC captures of both workers hold frames between the two net1 addresses in both directions.
  - id: no-duplicate-addresses
    description: No net1 address appears twice across the pods or the Whereabouts allocations, and each pod's address is held once for it.
  - id: recreate-releases-addresses
    description: >-
      Deleting both pods releases their Whereabouts allocations, and the recreated pods get pool addresses held once each, so
      nothing leaks.
  - id: pod-at-boot-waits-for-multus
    description: >-
      One worker reboots, and as soon as the new boot answers, a client pod that tolerates every NoSchedule taint is
      created there. Until Multus writes 00-multus.conf, every sample shows containerd without a network. The pod's first
      RunPodSandbox comes after that file's birth, the pod gets eth0 and net1, and the node's CNI layout holds afterwards.
  - id: new-pod-after-reboot-gets-net1
    description: The pod created at boot holds its pool address once and reaches the server over net1.
  - id: test-namespace-removed
    description: The lab namespace of the run, its pods and every Whereabouts allocation of it are gone at the end.
  - id: no-process-left
    description: After the run no process carrying this run id remains on any node.
