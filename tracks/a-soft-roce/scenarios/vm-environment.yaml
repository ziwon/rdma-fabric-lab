track: a-soft-roce
scenario: vm-environment
description: >-
  make collect. Snapshot of the host and the lab workers, their resolved inventory variables, and a comparison
  of every lab.* value in versions.lock.yaml with what the workers report. No traffic runs.
required: false
result_kind: software-rdma-measurement
security:
  privileged: false
  device_exposure: Read-only commands on the workers. sudo only reads the 0600 netplan file of the RDMA NIC.
checks:
  - id: guest-versions-match-lock
    description: OS, kernel, rdma-core packages and perftest on every worker equal their lab.* value in the lock.
  - id: guest-image-build
    description: The cloud image build each worker reports equals the dated build lab.guest_image pins.
  - id: guest-state-collected
    description: Every guest snapshot command exited 0 on every worker.
  - id: host-state-collected
    description: Every host snapshot command exited 0.
  - id: no-credential-collected
    description: >-
      No written file carries a private key, a kubeconfig client credential, a token or a password. A file that
      would is replaced by a note, and the check fails.
