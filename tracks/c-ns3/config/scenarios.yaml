# Parameters of each Track C scenario. tracks/c-ns3/scenarios/<scenario>.yaml declares its checks.
# steps go to the image's entry point as they are: <step name>, <program>, <argument>... Each scenario
# runs twice with the same inputs. rerun_break names what --break rerun-input-differs changes in run2.

# The DCQCN attributes of RdmaHw take SimAI's astra-sim-alibabacloud/inputs/config/SimAI.conf at a57d765:
# RATE_AI, RATE_HAI, MIN_RATE, EWMA_GAIN, RP_TIMER, RATE_DECREASE_INTERVAL, ALPHA_RESUME_INTERVAL,
# FAST_RECOVERY_TIMES and CLAMP_TARGET_RATE. SimAI.conf sets no RateOnFirstCnp, so it keeps the model's 1.0.
dcqcn: &dcqcn
  rate_ai: 50Mbps
  rate_hai: 100Mbps
  min_rate: 100Mbps
  ewma_gain: 0.00390625
  rp_timer: 900us
  rate_decrease_interval: 4us
  alpha_resume_interval: 1us
  fast_recovery_times: 1
  clamp_target_rate: false
  rate_on_first_cnp: 1.0

# Every incast scenario runs each fan-in with each profile and seed. A profile sets only pfc, ecn and cc.
# The receiver is the last host. Every link is the same, so the receiver's link is the bottleneck.
# The buffer is SimAI.conf's BUFFER_SIZE 32 divided by 8, so that the PFC threshold of the MMU,
# (buffer - headroom - reserve - shared) >> 3, falls inside the queue range these workloads reach.
incast:
  fan_in: [2, 4, 8]
  seeds: [1, 2, 3, 4, 5]
  link: {rate: 100Gbps, delay: 1us}
  profiles:
    c-none: {pfc: false, ecn: false, cc: none}
    c-pfc: {pfc: true, ecn: false, cc: none}
    c-ecn: {pfc: false, ecn: true, cc: dcqcn}
    c-both: {pfc: true, ecn: true, cc: dcqcn}
  network:
    stop_after: 20ms
    sample_interval: 1us
    mtu_bytes: 1000
    pfc_pause_time: 5us
    pfc_headroom_bdp_factor: 3
    pfc_alpha_shift: 3
    buffer_bytes: 4194304
    ecn_kmin_bytes: 400000
    ecn_kmax_bytes: 1600000
    ecn_pmax: 0.2
    l2_chunk_bytes: 4000
    l2_ack_interval: 1
    window_bytes: 0
    dcqcn: *dcqcn

scenarios:
  c-01-example:
    kind: simai-example
    # The quick smoke test of SimAI's docs/getting_started/installation.md, unchanged.
    steps:
      - [topology, gen-topo, --ro, -g, "8", -gt, H20, -bw, 200Gbps, -nvbw, 2400Gbps]
      - [simulate, simai, -t, "8", -w, /opt/simai/example/microAllReduce.txt, -n, ./Rail_Opti_SingleToR_8g_8gps_200Gbps_H20,
         -c, /opt/simai/astra-sim-alibabacloud/inputs/config/SimAI.conf]
    # Paths under the output directory. Each must exist and be non-empty in both runs.
    result_files:
      - work/Rail_Opti_SingleToR_8g_8gps_200Gbps_H20
      - work/ncclFlowModel_EndToEnd.csv
      - work/ncclFlowModel_detailed_flows.csv
      - work/ncclFlowModel_test1_dimension_utilization_0.csv
      - astra-sim/simulation/llama_hpn7_fct.txt
      - astra-sim/simulation/llama_hpn7_mix.tr
    # Written but empty in this example. They must exist in both runs and match.
    empty_result_files:
      - work/ncclFlowModel_detailed_9.csv
      - work/send.txt
      - astra-sim/simulation/llama_hpn7_pfc.txt
    # Not compared between runs: the log carries the wall-clock time and a thread id on its first line.
    log_files:
      - astra-sim/SimAI.log
    completion: {file: simulate.stdout, line: "All data received by node 7 is"}
    # Layer.cc writes total time as Sys::boostedTick() / FREQ: ns-3 nanoseconds / 1000.
    simulated_time: {file: work/ncclFlowModel_EndToEnd.csv, after: "total time,", seconds_per_unit: 1.0e-6}
    rerun_break: {step: topology, flag: -nvbw, value: 1200Gbps}

  c-02-single-flow:
    kind: star
    steps:
      - [simulate, rfl-star, /run/rfl/in/network.txt, /run/rfl/out/work]
    # Human units. python -m ns3 maps each value to the integer rfl-star applies, see scripts/ns3/network.py.
    network:
      seed: 1
      run: 1
      stop_after: 10ms
      hosts: [sender, receiver]
      links:
        - {host: sender, rate: 100Gbps, delay: 1us}
        - {host: receiver, rate: 100Gbps, delay: 1us}
      flows:
        - {src: sender, dst: receiver, payload_bytes: 1000000, start: 0ns, priority: 3}
      mtu_bytes: 1000
      cc: dcqcn
      pfc: true
      pfc_pause_time: 5us
      pfc_headroom_bdp_factor: 3
      pfc_alpha_shift: 3
      buffer_bytes: 33554432
      ecn: true
      ecn_kmin_bytes: 400000
      ecn_kmax_bytes: 1600000
      ecn_pmax: 0.2
      l2_chunk_bytes: 4000
      l2_ack_interval: 1
      window_bytes: 0
      dcqcn: *dcqcn
      sample_interval: 0ns
    rerun_break: {flow_start_shift: 1us}

  c-03-incast-simultaneous:
    kind: incast
    # Every sender starts one flow at the same time.
    workload: {kind: simultaneous, payload_bytes: 1000000, priority: 3}
    rerun_break: {flow_start_shift: 1us}

  c-04-incast-staggered:
    kind: incast
    # Sender k, counted from 0, starts one flow at k x gap. One flow alone takes about 84 us.
    workload: {kind: staggered, payload_bytes: 1000000, priority: 3, gap: 20us}
    rerun_break: {flow_start_shift: 1us}
    # Same kind and check code as c-03-incast-simultaneous, whose breaks cover every incast check.
    run_breaks: false

  c-05-incast-mixed:
    kind: incast
    # The first ceil(fan-in / 2) senders each start one large flow at 0. Every other sender starts one
    # small flow at each of small_starts. All flows share priority 3 and the receiver.
    workload: {kind: mixed, large_bytes: 1000000, small_bytes: 16000, small_starts: [10us, 30us, 50us, 70us], priority: 3}
    rerun_break: {flow_start_shift: 1us}
    run_breaks: false

  c-06-sensitivity-kmin:
    kind: incast
    # Optional. c-03-incast-simultaneous at fan-in 8 with kmin lowered from 400000 to 100000 B and
    # nothing else changed, to see how the ECN profiles move with the marking threshold alone.
    workload: {kind: simultaneous, payload_bytes: 1000000, priority: 3}
    overrides:
      fan_in: [8]
      network: {ecn_kmin_bytes: 100000}
    rerun_break: {flow_start_shift: 1us}
    run_breaks: false
