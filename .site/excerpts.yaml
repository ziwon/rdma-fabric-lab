# the run it came from, which `run` repeats here.
#
# Selection: `lines: a-b`, `block: <line prefix>` (to the next blank line) with optional `rows: [first cells]`,
# or `grep: <regex>` with `header: true`. `format: tsv` renders tab-separated rows as a table, and `columns`
# keeps the named TSV columns.

