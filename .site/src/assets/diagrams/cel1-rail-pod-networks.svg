    .orangebox { fill: #2b2620; stroke: #e1ad7d; stroke-width: 1.4; }
    .cyanline { stroke: #70c5d0; stroke-width: 2; }
    .limeline { stroke: #b2e879; stroke-width: 1.8; }
    .orangeline { stroke: #e1ad7d; stroke-width: 1.6; stroke-dasharray: 5 3; fill: none; }
    .name { font: 700 12.5px 'DM Sans', Inter, Arial, sans-serif; fill: #e6e9ed; }
    .small { font: 11px 'DM Sans', Inter, Arial, sans-serif; fill: #b6bfc9; }
