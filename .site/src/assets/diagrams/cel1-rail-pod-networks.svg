<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" width="960" height="616" role="img" aria-labelledby="t d">
  <title id="t">Pod networks on the rails of a cel1 DGX node</title>
  <desc id="d">One DGX B200 node of cel1 as ADR 0007 decides it. A pod in the namespace rdma-jobs gets eth0 from Cilium through Multus on the management port mgmt0, and rail0 to rail7, one IPoIB child of each host rail that ipoib-cni creates and nv-ipam addresses from the rail pool 10.143.r.0/24. The RDMA shared device plugin finds the ConnectX HCAs mlx5_0 to mlx5_7 by their rail netdev names and mounts their uverbs devices and rdma_cm into the pod, so NCCL uses verbs on all eight HCAs. Each host rail connects to the InfiniBand leaf of its rail. The NicClusterPolicy, eight IPoIBNetworks and eight IPPools come from the rail-networks chart, rendered from sites/cel1.yaml.</desc>
  <defs>
    <marker id="lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b2e879"/></marker>
    <marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#70c5d0"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e1ad7d"/></marker>
  </defs>
