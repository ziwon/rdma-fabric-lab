    .tier { font: 700 11.5px 'DM Sans', Inter, Arial, sans-serif; fill: #a0aab6; }
    .halo { paint-order: stroke; stroke: #1b1f23; stroke-width: 6px; stroke-linejoin: round; }
  </style>
