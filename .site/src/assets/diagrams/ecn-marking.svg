<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d">
  <title id="t">ECN marking probability against the egress queue</title>
  <desc id="d">No mark at or below kmin of 400000 bytes. Between kmin and kmax of 1600000 bytes the probability rises linearly to pmax 0.2. Above kmax every packet is marked.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .axis { stroke: #111111; stroke-width: 1.4; fill: none; }
    .grid { stroke: #D8D1C7; stroke-width: 1; }
    .curve { stroke: #111111; stroke-width: 2.4; fill: none; }
    .jump { stroke: #D9392E; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
    .hot { stroke: #D9392E; stroke-width: 2.4; fill: none; }
    .tick { font: 12px Inter, Arial, sans-serif; fill: #6F6A63; text-anchor: middle; }
    .ytick { font: 12px Inter, Arial, sans-serif; fill: #6F6A63; text-anchor: end; }
    .label { font: 12px Inter, Arial, sans-serif; fill: #050505; }
    .red { font: 700 12px Inter, Arial, sans-serif; fill: #D9392E; }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="330"/>

  <line class="grid" x1="80" y1="40" x2="680" y2="40"/>
  <line class="grid" x1="80" y1="232" x2="680" y2="232"/>
  <line class="grid" x1="200" y1="40" x2="200" y2="280"/>
  <line class="grid" x1="560" y1="40" x2="560" y2="280"/>

  <path class="axis" d="M80 30 V280 H690"/>

  <path class="curve" d="M80 280 H200 L560 232"/>
  <path class="jump" d="M560 232 V40"/>
  <path class="hot" d="M560 40 H680"/>

  <text class="ytick" x="72" y="44">1.0</text>
  <text class="ytick" x="72" y="236">pmax 0.2</text>
  <text class="ytick" x="72" y="284">0</text>

  <text class="tick" x="80" y="300">0</text>
  <text class="tick" x="200" y="300">kmin 400000 B</text>
  <text class="tick" x="560" y="300">kmax 1600000 B</text>
  <text class="tick" x="380" y="322">egress queue of the bottleneck port, bytes</text>

  <text class="label" x="92" y="268">never marked</text>
  <text class="label" x="250" y="222">linear from 0 to pmax</text>
  <text class="red" x="572" y="62">always marked</text>
  <text class="label" x="92" y="66">marking probability</text>
</svg>
