  <title id="t">The cel1 rail-optimized compute fabric</title>
  <desc id="d">Eight DGX hosts each connect HCA i to the leaf switch of rail i. Eight leaves each connect twice to each of four spines. Rail 0 is drawn in lime, and the leaf r3 to spine 02 pair, where B-04 fails one link, is dashed in red.</desc>
