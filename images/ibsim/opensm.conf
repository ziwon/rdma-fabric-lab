# OpenSM options of the Track B image. Every option not named here keeps its OpenSM 3.3.23 default.
# The routing engine is a scenario parameter, passed as opensm -R. 3.3.23 does not accept
# no_fallback, so a failed engine falls back to minhop. The runner fails a run whose log names
# any engine other than the configured one.
lmc 0
sweep_interval 10
sweep_on_trap TRUE
reassign_lids FALSE
log_flags 0x03
force_log_flush TRUE
