# cel1: an invented GPU region, the single source of its inventory, address plan and compute
# fabric. No value here belongs to a real site. `make fleet-render` writes
# ansible/inventories/cel1/ from this file and `make fleet-site-check` validates it.
site: cel1

kubernetes:
  # Every node registers its address on this network and the API address lives on it.
  node_network: management
  api: { vip: 10.140.0.10, port: 6443 }
  pod_cidr: 10.160.0.0/16
  service_cidr: 10.170.0.0/16
  # Cilium replaces kube-proxy. helm/cilium/values-cel1.yaml must agree.
  kube_proxy: false
  control_plane_schedulable: false
  # Control node path of the admin kubeconfig, outside every path git tracks (ADR 0001 section 5).
  admin_kubeconfig: ${XDG_STATE_HOME:-~/.local/state}/rdma-fabric-lab/cel1/kubeconfig

services:
  syslog: { address: 10.140.0.5, port: 514 }

# One L2 segment each. The QEMU simulation gives each its own unprivileged guest network.
networks:
  management: { cidr: 10.140.0.0/24, kind: ethernet }
  storage-a: { cidr: 10.141.0.0/24, kind: ethernet }
  storage-b: { cidr: 10.141.1.0/24, kind: ethernet }
  rail0: { cidr: 10.142.0.0/24, kind: infiniband, rail: 0 }
  rail1: { cidr: 10.142.1.0/24, kind: infiniband, rail: 1 }
  rail2: { cidr: 10.142.2.0/24, kind: infiniband, rail: 2 }
  rail3: { cidr: 10.142.3.0/24, kind: infiniband, rail: 3 }
  rail4: { cidr: 10.142.4.0/24, kind: infiniband, rail: 4 }
  rail5: { cidr: 10.142.5.0/24, kind: infiniband, rail: 5 }
  rail6: { cidr: 10.142.6.0/24, kind: infiniband, rail: 6 }
  rail7: { cidr: 10.142.7.0/24, kind: infiniband, rail: 7 }

# Interface names are what a systemd .link file renames each port to, on hardware and in a guest.
classes:
  control_plane:
    kube_role: control_plane
    os: Ubuntu 24.04
    interfaces:
      mgmt0: management
    labels:
      rfl.example/node-class: control-plane
  dgx_b200:
    kube_role: node
    # DGX OS ships the NVIDIA driver and container toolkit, so the GPU Operator leaves both alone
    # and containerd runs every container through the toolkit's runtime.
    os: DGX OS 7
    container_runtime: nvidia
    interfaces:
      mgmt0: management
      stor0: storage-a
      stor1: storage-b
      rail0: { network: rail0, hca: mlx5_0 }
      rail1: { network: rail1, hca: mlx5_1 }
      rail2: { network: rail2, hca: mlx5_2 }
      rail3: { network: rail3, hca: mlx5_3 }
      rail4: { network: rail4, hca: mlx5_4 }
      rail5: { network: rail5, hca: mlx5_5 }
      rail6: { network: rail6, hca: mlx5_6 }
      rail7: { network: rail7, hca: mlx5_7 }
    labels:
      rfl.example/node-class: dgx-b200
      nvidia.com/gpu.deploy.driver: "false"
      nvidia.com/gpu.deploy.container-toolkit: "false"
  pcie_gpu:
    kube_role: node
    # Earlier-generation PCIe GPU servers on plain Ubuntu, Ethernet only. The GPU Operator installs
    # the driver and the container toolkit.
    os: Ubuntu 24.04
    interfaces:
      mgmt0: management
    labels:
      rfl.example/node-class: pcie-gpu

