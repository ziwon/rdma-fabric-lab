fabrics:
  # The InfiniBand compute fabric. Rail r of every DGX lands on the leaf of rail r, on the leaf
  # port that matches the DGX number. Each leaf has 8 down ports and 8 uplinks from port 33, 2 to each
  # spine, so no leaf is oversubscribed. Milestone M4 renders its ibsim topology from this section.
  compute:
    kind: infiniband
    topology: rail-optimized
    link: { width: 4x, speed: NDR }
    switch_models:
      ndr-64: { ports: 64 }
    switches:
      cel1-ib-leaf-r0: { model: ndr-64, role: leaf, rail: 0 }
      cel1-ib-leaf-r1: { model: ndr-64, role: leaf, rail: 1 }
      cel1-ib-leaf-r2: { model: ndr-64, role: leaf, rail: 2 }
      cel1-ib-leaf-r3: { model: ndr-64, role: leaf, rail: 3 }
      cel1-ib-leaf-r4: { model: ndr-64, role: leaf, rail: 4 }
      cel1-ib-leaf-r5: { model: ndr-64, role: leaf, rail: 5 }
      cel1-ib-leaf-r6: { model: ndr-64, role: leaf, rail: 6 }
      cel1-ib-leaf-r7: { model: ndr-64, role: leaf, rail: 7 }
      cel1-ib-spine-01: { model: ndr-64, role: spine }
      cel1-ib-spine-02: { model: ndr-64, role: spine }
      cel1-ib-spine-03: { model: ndr-64, role: spine }
      cel1-ib-spine-04: { model: ndr-64, role: spine }
    links:
      - [cel1-dgx-01/rail0, cel1-ib-leaf-r0/1]
      - [cel1-dgx-02/rail0, cel1-ib-leaf-r0/2]
      - [cel1-dgx-03/rail0, cel1-ib-leaf-r0/3]
