# No default inventory. Every command names -i inventories/<name>/hosts.yml,
# so a lab command can never land on the hardware fleet by omission.
# Collections come only from the pinned ansible package, nothing is installed from galaxy.
[defaults]
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
forks = 25
timeout = 30
callbacks_enabled = ansible.posix.profile_tasks
callback_result_format = yaml

[inventory]
enable_plugins = ansible.builtin.yaml
any_unparsed_is_failed = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=5m
