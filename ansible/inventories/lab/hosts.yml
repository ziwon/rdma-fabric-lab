# PLAN 3.2 example addresses. Connection details and NIC names differ per
# hypervisor, so they come from a second inventory passed after this one:
# the QEMU harness writes .lab/inventory.yml, a VMware lab writes its own.
all:
  children:
    lab:
      children:
        k8s_cluster:
          children:
            kube_control_plane:
              hosts:
                cp1:
                  ansible_host: 192.168.140.11
                  k8s_node_ip: 192.168.140.11
            kube_node:
              children:
                workers:
                  hosts:
                    worker1:
                      ansible_host: 192.168.140.12
                      k8s_node_ip: 192.168.140.12
                      lab_rdma_ip: 10.77.0.12
                    worker2:
                      ansible_host: 192.168.140.13
                      k8s_node_ip: 192.168.140.13
                      lab_rdma_ip: 10.77.0.13
