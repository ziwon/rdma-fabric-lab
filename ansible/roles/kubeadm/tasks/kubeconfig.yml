- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: "{{ kubeadm_admin }}"
  register: kubeadm_admin_conf
  no_log: true

- name: Create the directory of the local kubeconfig
  ansible.builtin.file:
    path: "{{ kubeadm_kubeconfig_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Write the admin kubeconfig to {{ kubeadm_kubeconfig_path }}
  ansible.builtin.copy:
    content: "{{ kubeadm_local_kubeconfig | to_nice_yaml(indent=2) }}"
    dest: "{{ kubeadm_kubeconfig_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
  vars:
    kubeadm_remote: "{{ kubeadm_admin_conf.content | b64decode | from_yaml }}"
    kubeadm_cluster: "{{ kubeadm_remote.clusters | first }}"
    # The kube-apiserver certificate names "kubernetes", so a forwarded address still verifies.
    kubeadm_local_kubeconfig: >-
      {{ kubeadm_remote if rfl_kubeconfig_server | default('') | length == 0 else kubeadm_remote | combine({'clusters': [
         kubeadm_cluster | combine({'cluster': kubeadm_cluster.cluster | combine({'server': rfl_kubeconfig_server,
         'tls-server-name': 'kubernetes'})})]}) }}
