- name: Check the inventory names two distinct NICs and an RDMA address
  ansible.builtin.assert:
    that:
      - lab_mgmt_nic is defined
      - lab_rdma_nic is defined
      - lab_rdma_ip is defined
      - lab_mgmt_nic != lab_rdma_nic
      - lab_rdma_ip is ansible.utils.in_network(lab_address_plan.rdma)
    fail_msg: >-
      {{ inventory_hostname }} needs lab_mgmt_nic, lab_rdma_nic and lab_rdma_ip, the two NICs must differ, and
      lab_rdma_ip must sit in {{ lab_address_plan.rdma }}. Set them in the override inventory of this lab.
    quiet: true

- name: Read the state of systemd-networkd
  ansible.builtin.systemd_service:
    name: systemd-networkd.service
  register: network_networkd
  check_mode: true

- name: Refuse a guest whose netplan renderer is not systemd-networkd
  ansible.builtin.assert:
    that: network_networkd.status.ActiveState == 'active'
    fail_msg: >-
      systemd-networkd is {{ network_networkd.status.ActiveState }} on {{ inventory_hostname }}. This role writes a
      netplan file for systemd-networkd and reloads only the RDMA NIC, which a NetworkManager guest would ignore.
    quiet: true

- name: Verify the SSH path before the change
  ansible.builtin.include_tasks: ssh_path.yml

- name: Write the netplan file of the RDMA NIC
  ansible.builtin.template:
    src: rdma-nic.yaml.j2
    dest: /etc/netplan/60-rfl-rdma.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Apply the RDMA NIC configuration

- name: Apply the RDMA NIC configuration now
  ansible.builtin.meta: flush_handlers

- name: Wait for the RDMA address on {{ lab_rdma_nic }}
  ansible.builtin.command: ip -4 -o addr show dev {{ lab_rdma_nic }}
  register: network_rdma_addr
  until: network_rdma_addr.stdout is search('inet ' ~ (lab_rdma_ip ~ '/' ~ network_prefix) | regex_escape ~ ' ')
  retries: 15
  delay: 2
  changed_when: false
  check_mode: false

- name: Verify the SSH path after the change
  ansible.builtin.include_tasks: ssh_path.yml

- name: Check the RDMA NIC holds the planned address and MTU and no default route
  ansible.builtin.assert:
    that:
      - ansible_facts[network_rdma_key].ipv4.address | default('') == lab_rdma_ip
      - ansible_facts[network_rdma_key].mtu == lab_rdma_mtu
      - ansible_facts.default_ipv4.interface != lab_rdma_nic
    fail_msg: >-
      {{ lab_rdma_nic }} on {{ inventory_hostname }} has address {{ ansible_facts[network_rdma_key].ipv4.address | default('none') }}
      and MTU {{ ansible_facts[network_rdma_key].mtu }}, wanted {{ lab_rdma_ip }} and {{ lab_rdma_mtu }}, and the
      default route must stay on {{ network_uplink_nic }}.
    quiet: true
