---
- name: Refuse a host without a syslog server
  ansible.builtin.assert:
    that:
      - rsyslog_client_tcp_host is defined
      - rsyslog_client_tcp_host | string | length > 0
      - rsyslog_client_tcp_port | int > 0
    fail_msg: rsyslog_client_tcp_host and rsyslog_client_tcp_port come from the site model. Nothing was changed.
    quiet: true

- name: Ensure rsyslog is installed
  ansible.builtin.package:
    name: rsyslog
    state: present

- name: Configure syslog forwarding
  ansible.builtin.template:
    src: 99-forward-syslog.conf.j2
    dest: /etc/rsyslog.d/99-forward-syslog.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

- name: Ensure rsyslog runs
  ansible.builtin.service:
    name: rsyslog
    state: started
    enabled: true
