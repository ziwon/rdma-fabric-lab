- name: Leave Multus's file alone in the CNI directory containerd reads, on a cluster built while Cilium wrote there
  hosts: k8s_cluster
  become: true
  serial: 1
  pre_tasks:
    - name: Refuse an inventory whose Helm environment installs no Multus
      vars:
        cni_migrate_multus: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../helm/releases.yaml') | from_yaml).releases
          | selectattr('name', 'equalto', 'multus') | first }}"
      ansible.builtin.assert:
        that: rfl_inventory | default('') in cni_migrate_multus.environments
        fail_msg: "{{ inventory_hostname }} belongs to Helm environment {{ rfl_inventory | default('none') }}, which has no Multus."
        quiet: true
  roles:
    - cni_layout
