---
# Simulation only. Guests of an invented site stand in for three things the site model names but a
# guest lacks: the NVIDIA container runtime that DGX OS ships, the PCI label that Node Feature
# Discovery gives a node with rail HCAs, and the central syslog server that the model names only by
# address. None belongs in the fleet inventory or the fleet roles.
- name: Refuse every host that is not a simulation guest
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check the host is a harness guest behind 127.0.0.1
      ansible.builtin.assert:
        that: ansible_host | default('') == '127.0.0.1'
        fail_msg: "{{ inventory_hostname }} is not a simulation guest on 127.0.0.1. Nothing was changed."
        quiet: true

- name: Stand in for the NVIDIA container runtime of DGX OS
  hosts: k8s_cluster
  become: true
  tasks:
    # The guests have no GPU and no NVIDIA software. The stand-in keeps the nvidia runtime path of
    # containerd in use: it logs each call, so a check can find the containers it ran, and execs runc.
    - name: Install the runtime stand-in on nodes whose containerd defaults to nvidia
      ansible.builtin.copy:
        dest: /usr/bin/nvidia-container-runtime
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          # Simulation stand-in for the NVIDIA container runtime. It changes nothing and execs runc.
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*" >> /var/log/rfl-nvidia-container-runtime.log
          exec /usr/local/sbin/runc "$@"
      when: k8s_container_runtime_default | default('runc') == 'nvidia'

# The operator schedules the RDMA shared device plugin only on nodes that Node Feature Discovery labels with a Mellanox
# PCI device, feature.node.kubernetes.io/pci-15b3.present=true, which NFD gives a DGX node for its ConnectX ports
# (ADR 0007, docs/fleet.md section 14). A guest has no such device, so the rail hosts get the label NFD would give them.
# The hosts are the ones the rendered rail network values select. The play labels only registered Nodes, so it runs
# again after make fleet-k8s.
- name: Stand in for the Node Feature Discovery label of the rail HCAs
  hosts: k8s_cluster
  gather_facts: false
  vars:
    rfl_sim_kubectl: kubectl --kubeconfig /etc/kubernetes/admin.conf
    rfl_sim_first_cp: "{{ groups['kube_control_plane'][0] }}"
    rfl_sim_mellanox_label: feature.node.kubernetes.io/pci-15b3.present
    rfl_sim_rail_values_file: "{{ playbook_dir }}/../../helm/rail-networks/values-{{ rfl_inventory }}.yaml"
    rfl_sim_rail_values: "{{ lookup('ansible.builtin.file', rfl_sim_rail_values_file, errors='ignore') | default('', true) | from_yaml }}"
    # A host carries every label of the node selector with its value.
    rfl_sim_rail_host: >-
      {{ (rfl_sim_rail_values or {}).get('rails', []) | length > 0
         and rfl_sim_rail_values.nodeSelector.items() | list
             | difference((k8s_node_labels | default({})).items() | list) | length == 0 }}
  tasks:
    - name: Read the Mellanox PCI label of the Node
      ansible.builtin.command: >-
        {{ rfl_sim_kubectl }} get node {{ inventory_hostname }} --ignore-not-found
        -o 'jsonpath={.metadata.labels.feature\.node\.kubernetes\.io/pci-15b3\.present}'
      delegate_to: "{{ rfl_sim_first_cp }}"
      become: true
      register: rfl_sim_label
      changed_when: false
      failed_when: false
      when: rfl_sim_rail_host | bool

    - name: Label the Node as NFD labels a node with a Mellanox NIC
      ansible.builtin.command: "{{ rfl_sim_kubectl }} label node {{ inventory_hostname }} {{ rfl_sim_mellanox_label }}=true --overwrite"
      delegate_to: "{{ rfl_sim_first_cp }}"
      become: true
      changed_when: true
      when: rfl_sim_rail_host | bool and rfl_sim_label.rc == 0 and rfl_sim_label.stdout != 'true'

- name: Stand in for the central syslog server
  hosts: simulation_syslog
  become: true
  handlers:
    - name: Restart rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted
  tasks:
    - name: Create the directory of the received logs
      ansible.builtin.file:
        path: /var/log/remote
        state: directory
        owner: syslog
        group: adm
        mode: "0755"

    - name: Receive syslog over TCP on the site syslog address, one file per sending host
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/10-rfl-receive.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          module(load="imtcp")
          template(name="rfl-per-host" type="string" string="/var/log/remote/%HOSTNAME%.log")
          ruleset(name="rfl-remote") { action(type="omfile" dynaFile="rfl-per-host") }
          input(type="imtcp" address="{{ rsyslog_client_tcp_host }}" port="{{ rsyslog_client_tcp_port }}" ruleset="rfl-remote")
      notify: Restart rsyslog

    - name: Ensure rsyslog runs
      ansible.builtin.service:
        name: rsyslog
        state: started
        enabled: true
