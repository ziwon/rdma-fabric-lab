# Three control planes behind a VIP and one worker, the shape of the fleet's cluster, on harness
# guests. ha-cp3 is schedulable and ha-cp2 carries a label, so both registration paths run.
all:
  children:
    k8s_cluster:
      children:
        kube_control_plane:
          hosts:
            ha-cp1:
              k8s_node_ip: 192.168.140.21
              k8s_control_plane_schedulable: false
              k8s_node_labels: {}
            ha-cp2:
              k8s_node_ip: 192.168.140.22
              k8s_control_plane_schedulable: false
              k8s_node_labels:
                rdma-fabric-lab/profile: ha
            ha-cp3:
              k8s_node_ip: 192.168.140.23
              k8s_control_plane_schedulable: true
              k8s_node_labels: {}
        kube_node:
          hosts:
            ha-w1:
              k8s_node_ip: 192.168.140.31
              k8s_control_plane_schedulable: false
              k8s_node_labels: {}
