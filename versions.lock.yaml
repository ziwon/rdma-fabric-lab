---
# value: null marks a component nobody has selected yet. `make versions SCOPE=<name>`
# refuses a scope while any of its components is null, and install targets depend on it.
# kind: observed marks a value read from the running environment, not chosen up front.
schema_version: 1
components:
  tooling.python:
    kind: version
    value: '3.12'
    reason: Ubuntu 24.04 system Python. ansible 14 supports it, and make venv builds on it.
    source: /usr/bin/python3.12 --version
  tooling.ansible:
    kind: version
    value: 14.6.0
    reason: Newest ansible package on 2026-11-15. It bundles every collection the roles use, so nothing comes from galaxy.
    source: requirements.txt
  tooling.ansible_core:
    kind: version
    value: 2.21.6
    reason: Resolved by uv from ansible 14.6.0. ansible-core 2.22 needs Python 3.13 and no ansible package ships it yet.
    source: requirements.txt
  tooling.ansible_lint:
    kind: version
    value: 26.11.0
    reason: Newest release uv resolves on 2026-11-15.
    source: requirements.txt
  tooling.yamllint:
    kind: version
    value: 1.38.0
    reason: Newest release uv resolves on 2026-11-15.
    source: requirements.txt
  tooling.helm:
    kind: version
    value: v4.3.2
    reason: Newest Helm release on 2026-11-15. make tools installs it into .tools/bin, so the host helm never runs.
    source: https://github.com/helm/helm/releases/tag/v4.3.2
  tooling.helm_archive:
    kind: checksum
    value: sha256:d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
    reason: helm-v4.3.2-linux-amd64.tar.gz. make tools refuses any other bytes.
    source: https://get.helm.sh/helm-v4.3.2-linux-amd64.tar.gz.sha256sum
  tooling.kubeconform:
    kind: version
    value: v0.8.0
    reason: Newest release on 2026-11-15. Validates rendered charts offline against the Kubernetes version below.
    source: https://github.com/yannh/kubeconform/releases/tag/v0.8.0
  tooling.kubeconform_archive:
    kind: checksum
    value: sha256:9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    reason: kubeconform-linux-amd64.tar.gz. make tools refuses any other bytes.
    source: https://github.com/yannh/kubeconform/releases/download/v0.8.0/CHECKSUMS
  lab.guest_os:
    kind: version
    value: Ubuntu 24.04.5 LTS
    ref: noble
    reason: The lab guests run Ubuntu Server 24.04 LTS. Read from a worker guest booted from lab.guest_image.
    source: PRETTY_NAME in /etc/os-release inside worker1 and worker2
  lab.guest_image:
    kind: checksum
    value: sha256:04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94
    ref: noble/20261017
    reason: Newest dated Ubuntu 24.04 cloud image build on 2026-11-15. The value matches SHA256SUMS of that build, whose GPG signature verifies
      against ubuntu-cloudimage-keyring. The QEMU harness downloads source and refuses the file unless it hashes to value.
    source: https://cloud-images.ubuntu.com/noble/20261017/noble-server-cloudimg-amd64.img
  lab.guest_kernel:
    kind: observed
    value: 6.8.0-147-generic
    reason: Kernel the 20261017 image boots. It ships without rdma_rxe. linux-modules-extra-6.8.0-147-generic in noble-updates provides it. The
      common role holds the kernel metapackages so the guests stay on this release.
    source: uname -r inside worker1 and worker2
  lab.rdma_core:
    kind: observed
    value: 50.0-2ubuntu0.2
    reason: Candidate in noble-updates on 2026-11-15. The common role installs rdma-core, ibverbs-providers, ibverbs-utils and rdmacm-utils at
      exactly this version, all built from the rdma-core source.
    source: apt-cache policy rdma-core inside worker1 and worker2
  lab.perftest:
    kind: observed
    value: 24.01.0+0.38-1build2
    reason: Only version in noble. Both ends of every test run this one, which the common role installs.
    source: apt-cache policy perftest inside worker1 and worker2
  lab.k8s_test_image:
    kind: image-digest
    value: sha256:302d6221f7d600725e0f926f9f04f8fbbb2a32678b4e991da760a5062d4dc7e1
    ref: registry.k8s.io/e2e-test-images/busybox:1.38.0-1
    reason: Newest busybox of the Kubernetes e2e test images on 2026-11-15. The k8s-baseline pods run it for httpd, wget and
      nslookup. registry.k8s.io serves it without the Docker Hub pull limit. The value is the OCI index digest, and containerd
      pulled the image by it on worker1.
    source: https://registry.k8s.io/v2/e2e-test-images/busybox/manifests/1.38.0-1
  host.os:
    kind: observed
    value: Ubuntu 24.04.5 LTS
    reason: Machine that ran the M1 verification guests. make doctor reports a different host.
    source: PRETTY_NAME in /etc/os-release on the host
  host.kernel:
    kind: observed
    value: 7.0.0-42-generic
    reason: Machine that ran the M1 verification guests. RXE performance depends on it, so results name it.
    source: uname -r on the host
  host.hypervisor:
    kind: observed
    value: qemu-system-x86 1:8.2.2+ds-0ubuntu1.18 with KVM
    reason: VMware Workstation is not installed on this host. Unprivileged QEMU/KVM guests from tests/integration/qemu-lab are the verification
      harness. docs/setup-vmware.md keeps the VMware procedure.
    source: dpkg-query -W qemu-system-x86 on the host, and /dev/kvm access
  k8s.kubernetes:
    kind: version
    value: v1.36.6
    reason: Newest patch of the newest minor that Cilium 1.20 lists as e2e tested (1.33 to 1.36). Kubernetes v1.37.2 is out on 2026-11-15, but
      only the Cilium development branch tests 1.37.
    source: https://dl.k8s.io/release/stable-1.36.txt and Cilium v1.20.4 Documentation/network/kubernetes/compatibility.rst
  k8s.kubeadm_package:
    kind: version
    value: 1.36.6-1.1
    reason: Debian package version of kubeadm, kubelet and kubectl for k8s.kubernetes in the pkgs.k8s.io v1.36 repository.
    source: https://pkgs.k8s.io/core:/stable:/v1.36/deb/Packages
  k8s.cri_tools:
    kind: version
    value: v1.36.0
    reason: crictl follows the Kubernetes minor. Newest v1.36 release.
    source: https://github.com/kubernetes-sigs/cri-tools/releases/tag/v1.36.0
  k8s.containerd:
    kind: version
    value: 2.4.2
    reason: Newest containerd release on 2026-11-15, installed from the upstream release archive.
    source: https://github.com/containerd/containerd/releases/tag/v2.4.2
  k8s.containerd_archive:
    kind: checksum
    value: sha256:35880c1dd4627e8ce56526bfabb39c144e83458ffdb197ce6f05d17d94d7d91e
    reason: containerd-2.4.2-linux-amd64.tar.gz. sha256sum of the downloaded archive equals the published .sha256sum file. The containerd role
      refuses any other bytes.
    source: https://github.com/containerd/containerd/releases/download/v2.4.2/containerd-2.4.2-linux-amd64.tar.gz
  k8s.runc:
    kind: version
    value: 1.5.3
    reason: Newest runc release on 2026-11-15, published 2026-11-12.
    source: https://github.com/opencontainers/runc/releases/tag/v1.5.3
  k8s.runc_binary:
    kind: checksum
    value: sha256:50dcc0b257d724fe07f3852c2dda52340223f038227c7572644eec870741223e
    reason: runc.amd64 of runc 1.5.3. sha256sum of the downloaded binary equals the line in the signed runc.sha256sum. The containerd role
      refuses any other bytes.
    source: https://github.com/opencontainers/runc/releases/download/v1.5.3/runc.amd64
  k8s.cni_plugins:
    kind: version
    value: v1.10.0
    reason: Newest CNI plugins release on 2026-11-15. Cilium needs only loopback from it. macvlan and ipvlan serve Multus at M3.
    source: https://github.com/containernetworking/plugins/releases/tag/v1.10.0
  k8s.cni_plugins_archive:
    kind: checksum
    value: sha256:ce8603d6a1bd448efba5bd6dc44f38dce349f821aa57e1bb354b52628ebf1853
    reason: cni-plugins-linux-amd64-v1.10.0.tgz. sha256sum of the downloaded archive equals the published .sha256 file. The containerd role
      refuses any other bytes.
    source: https://github.com/containernetworking/plugins/releases/download/v1.10.0/cni-plugins-linux-amd64-v1.10.0.tgz
  k8s.kube_vip:
    kind: version
    value: v1.3.1
    reason: Newest kube-vip release on 2026-11-15. Advertises the API address of a cluster with more than one control plane.
    source: https://github.com/kube-vip/kube-vip/releases/tag/v1.3.1
  k8s.kube_vip_image:
    kind: image-digest
    value: sha256:1962f9daf226503f7e6b107f595cb28b7917fd2d0113957075e19a3e5a6c1e33
    ref: ghcr.io/kube-vip/kube-vip:v1.3.1
    reason: OCI image index of ghcr.io/kube-vip/kube-vip:v1.3.1, so every platform is pinned. The registry returned it as Docker-Content-Digest
      and sha256 of the index body equals it. The kubeadm role writes the static pod with tag and digest.
    source: https://ghcr.io/v2/kube-vip/kube-vip/manifests/v1.3.1
  cni.cilium_chart:
    kind: version
    value: 1.20.4
    reason: Newest Cilium release on 2026-11-15. The user asked for the newest Cilium, installed by Helm.
    source: https://helm.cilium.io/index.yaml
  cni.multus:
    kind: version
    value: v4.3.2
    reason: Newest Multus release on 2026-11-15. Applied from the pinned upstream manifest at milestone M3.
    source: https://github.com/k8snetworkplumbingwg/multus-cni/releases/tag/v4.3.2
  cni.multus_manifest:
    kind: checksum
    value: sha256:5e25393b382931836b48a77a085c536b133d545dc2a1254702442ea4c0f2ed73
    ref: v4.3.2
    reason: deployments/multus-daemonset-thick.yml at tag v4.3.2, commit 1d81062afcb32eb7290fa28bcbc482c3d0c5cae9. Multus publishes
      no Helm chart for v4.3.2, so helm/multus/chart carries this file byte for byte and swaps only its snapshot-thick image for
      cni.multus_image. A unit test checks the sha256 and that the chart renders the same objects.
    source: https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/1d81062afcb32eb7290fa28bcbc482c3d0c5cae9/deployments/multus-daemonset-thick.yml
  cni.multus_image:
    kind: image-digest
    value: sha256:109b885d8752fe7a7bc3b2371750bfad6789b8b8e2d0b0820b337386ba9b93c9
    ref: ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.2-thick
    reason: OCI image index of the v4.3.2 thick plugin, the daemon and its install init container. The registry returned it as
      Docker-Content-Digest and sha256 of the index body equals it. make addons sets it as tag and digest.
    source: https://ghcr.io/v2/k8snetworkplumbingwg/multus-cni/manifests/v4.3.2-thick
  cni.whereabouts:
    kind: version
    value: v0.9.4
    reason: Newest Whereabouts release on 2026-11-15.
    source: https://github.com/k8snetworkplumbingwg/whereabouts/releases/tag/v0.9.4
  cni.whereabouts_chart:
    kind: version
    value: 0.9.4
    reason: The chart the Whereabouts release workflow pushes for tag v0.9.4, appVersion v0.9.4. helm pull gave OCI manifest digest
      sha256:3a12f4d67dcdeb3e171460197534f61879d54114f08f390c0ab4f2b20cd6840a on 2026-11-16.
    source: oci://ghcr.io/k8snetworkplumbingwg/whereabouts-chart
  cni.whereabouts_image:
    kind: image-digest
    value: sha256:f279fd7dc1124d7819330fb2e07357990b2b4c5d8733aef1b028573c29f05e14
    ref: ghcr.io/k8snetworkplumbingwg/whereabouts:v0.9.4
    reason: OCI image index of Whereabouts v0.9.4. The daemon and the reconciler of the chart both run it. The registry returned it as
      Docker-Content-Digest and sha256 of the index body equals it. make addons sets it as tag and digest.
    source: https://ghcr.io/v2/k8snetworkplumbingwg/whereabouts/manifests/v0.9.4
  lab.rdma_tools_base_image:
    kind: image-digest
    value: sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
    ref: ubuntu:24.04
    reason: OCI index of ubuntu:24.04 that Docker Hub served on 2026-11-15, the same base as ibsim.base_image. images/rdma-tools/Dockerfile
      starts FROM it by digest.
    source: docker pull ubuntu:24.04 and docker image inspect RepoDigests inside ibsim1
  lab.rdma_tools_apt_snapshot:
    kind: version
    value: 20261115T000000Z
    reason: Ubuntu archive snapshot the RDMA test image installs every package from. It serves lab.rdma_core and lab.perftest, the
      versions the workers run.
    source: https://snapshot.ubuntu.com/ubuntu/20261115T000000Z/
  lab.rdma_tools_image:
    kind: image-digest
    value: sha256:756e51cfbd6399905cef22945b3be3daa143f258b688f081f9e1c8b5fe5e280d
    ref: docker.io/library/rfl-rdma-tools:m3
    reason: OCI index of the archive make rdma-tools-image builds from images/rdma-tools/Dockerfile inside the Track B guest,
      without cache and with every time clamped to lab.rdma_tools_apt_snapshot. Separate builds gave the same archive bytes.
      ctr import --digests names the image by this digest on each worker, and the hostNetwork RDMA pods reference it.
    source: sha256 of index.json in the archive that images/rdma-tools/build.sh writes inside ibsim1
  addons.gpu_operator_chart:
    kind: version
    value: v26.7.2
    reason: Newest NVIDIA GPU Operator chart on 2026-11-15. Installed by Helm on the GPU fleet only.
    source: https://helm.ngc.nvidia.com/nvidia/index.yaml
  ibsim.guest_kernel:
    kind: observed
    value: 6.8.0-147-generic
    reason: Kernel the lab.guest_image boots in the ibsim harness guest. ibsim, OpenSM and the diagnostic tools run on this kernel, never
      on the host kernel. track-b-guest.yml refuses any other.
    source: uname -r inside ibsim1 of tests/integration/qemu-lab/profiles/ibsim.tsv
  ibsim.guest_docker:
    kind: version
    value: 29.1.3-0ubuntu3~24.04.2
    reason: Candidate of docker.io in noble-updates on 2026-11-15, the container runtime of the Track B guest. ADR 0002 runs the ibsim
      image in a container runtime inside that guest.
    source: apt-cache policy docker.io inside ibsim1
  ibsim.guest_buildx:
    kind: version
    value: 0.30.1-0ubuntu1~24.04.1
    reason: Candidate of docker-buildx in noble-updates on 2026-11-15. docker build uses BuildKit through it, whose layer cache the second
      build reuses.
    source: apt-cache policy docker-buildx inside ibsim1
  ibsim.guest_containerd:
    kind: version
    value: 2.2.1-0ubuntu1~24.04.4
    reason: Candidate of containerd in noble-updates on 2026-11-15, the version docker.io pulls in. Pinned and held with it.
    source: apt-cache policy containerd inside ibsim1
  ibsim.guest_runc:
    kind: version
    value: 1.3.4-0ubuntu1~24.04.1
    reason: Candidate of runc in noble-updates on 2026-11-15, the version docker.io pulls in. Pinned and held with it.
    source: apt-cache policy runc inside ibsim1
  ibsim.base_image:
    kind: image-digest
    value: sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
    ref: ubuntu:24.04
    reason: OCI index of ubuntu:24.04 that Docker Hub served on 2026-11-15, created 2026-11-10. images/ibsim/Dockerfile starts FROM
      it by digest.
    source: docker pull ubuntu:24.04 and docker image inspect RepoDigests inside ibsim1
  ibsim.apt_snapshot:
    kind: version
    value: 20261115T000000Z
    reason: Ubuntu archive snapshot the image installs every package from, dependencies included. The Dockerfile replaces the base
      image's sources with this snapshot only, so a rebuild cannot pick up a newer package.
    source: https://snapshot.ubuntu.com/ubuntu/20261115T000000Z/
  ibsim.ibsim:
    kind: version
    value: 0.10-2build1
    reason: ibsim-utils and libumad2sim0 in noble universe, built from upstream ibsim 0.10. It ships ibsim, libumad2sim.so and the
      upstream net-examples. Upstream 0.12 exists but no Ubuntu package carries it, and 0.10 runs every scenario.
    source: images/ibsim/Dockerfile installs both from ibsim.apt_snapshot (docs/milestones/evidence/m4/image-build-1.log). Upstream tag
      ibsim-0.10 of github.com/linux-rdma/ibsim dereferences to commit c7e430dc3d9bb677e53a8cd9ca87c5d27d406aa1 (git ls-remote --tags)
  ibsim.opensm:
    kind: version
    value: 3.3.23-2
    reason: opensm in noble universe. OpenSM 3.3.23 routes with minhop by default and supports updn, dnup, file, ftree, lash, dor,
      torus-2QoS, nue, dfsssp and sssp (opensm --help in the image, docs/milestones/evidence/m4/probe/09-opensm-options.txt).
    source: images/ibsim/Dockerfile installs it from ibsim.apt_snapshot (docs/milestones/evidence/m4/image-build-1.log)
  ibsim.infiniband_diags:
    kind: version
    value: 50.0-2ubuntu0.2
    reason: infiniband-diags in noble-updates, from rdma-core 50.0 like lab.rdma_core. ibnetdiscover, iblinkinfo, ibswitches, ibhosts,
      ibroute and smpquery come from it.
    source: images/ibsim/Dockerfile installs it from ibsim.apt_snapshot (docs/milestones/evidence/m4/image-build-1.log)
  ibsim.image:
    kind: image-digest
    value: sha256:cb3e3550f4f60de5414abe55dbe81e45fd68106ef5ecc4cfa4d701b6083ee279
    ref: rfl-ibsim:m4
    reason: Built from images/ibsim/Dockerfile inside ibsim1 by make track-b-image. A second build reuses every layer and gives the same
      ID. Every Track B scenario ran on it.
    source: docker image inspect --format {{.Id}} rfl-ibsim:m4 inside ibsim1 after guest.sh build
      (docs/milestones/evidence/m4/image-build-final-1.log, image-build-final-2.log)
  ns3.guest_kernel:
    kind: observed
    value: 6.8.0-147-generic
    reason: Kernel the lab.guest_image boots in the ns3 harness guest. The ns-3 build and every simulator run happen on this kernel,
      never on the host kernel. track-c-guest.yml refuses any other.
    source: uname -r inside ns3sim1 of tests/integration/qemu-lab/profiles/ns3.tsv (docs/milestones/evidence/m5/guest-facts.txt)
  ns3.simai:
    kind: git-sha
    value: a57d765c5478f319c5f5ab6fdc53f9cc7f461743
    ref: master of github.com/aliyun/SimAI on 2026-11-16, committed 2026-09-20
    reason: Newest SimAI commit. Its ./scripts/build.sh -c ns3 builds the ns-3 network backend and the shipped quick-start example
      runs on it. The build probe in ns3sim1 built it with gcc 13.3.0, CMake 3.28.3 and Python 3.12.3 in 62 s and ran the example twice.
    source: git ls-remote and the probe in docs/milestones/evidence/m5/probe/02-simai-noble-inner.log
  ns3.ns3_alibabacloud:
    kind: git-sha
    value: 3e0c7c1bfbbe9f77890ddcf5e5b9c79fc6dd7437
    ref: gitlink ns-3-alibabacloud of SimAI a57d765
    reason: Submodule commit that ns3.simai records. It is the master HEAD of github.com/aliyun/ns-3-alibabacloud on 2026-11-16, ns-3
      3.36.1 with the RDMA, PFC, ECN and DCQCN model. images/ns3/fetch-sources refuses any other commit.
    source: git ls-tree a57d765 ns-3-alibabacloud (docs/milestones/evidence/m5/probe/00-source-reading.txt)
  ns3.simccl:
    kind: git-sha
    value: fd7cd57d16f9bd42e3ccb70911c977e18ec294b9
    ref: gitlink SimCCL of SimAI a57d765
    reason: Submodule commit that ns3.simai records. The ns3 build copies its mock NCCL v2.30 sources into the ns-3 applications module.
      aicb and SimAI-CLEM generate workloads and are not fetched.
    source: git ls-tree a57d765 SimCCL (docs/milestones/evidence/m5/probe/00-source-reading.txt)
  ns3.base_image:
    kind: image-digest
    value: sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
    ref: ubuntu:24.04
    reason: The ubuntu:24.04 index that ibsim.base_image pins, created 2026-11-10. Both stages of images/ns3/Dockerfile start from it by
      digest. The probe built SimAI on it, so no older userspace is needed. The tag ubuntu:24.04 has moved since.
    source: docker pull and docker image inspect inside ns3sim1 (docs/milestones/evidence/m5/probe/01-base-image.txt)
  ns3.apt_snapshot:
    kind: version
    value: 20261115T000000Z
    reason: Ubuntu archive snapshot that both image stages install every package from, the one ibsim.apt_snapshot pins.
      images/ns3/apt-snapshot-install replaces the base image's sources with it alone.
    source: https://snapshot.ubuntu.com/ubuntu/20261115T000000Z/
  ns3.source_date_epoch:
    kind: version
    value: '1789890942'
    reason: SOURCE_DATE_EPOCH of the image build, the commit time of ns3.simai (2026-09-20T15:55:42+08:00). BuildKit sets every file
      time and the image creation time to it, so a rebuild writes no build time.
    source: git log -1 --format=%ct a57d765c5478f319c5f5ab6fdc53f9cc7f461743
  ns3.gcc:
    kind: observed
    value: 13.3.0-6ubuntu2~24.04.1
    reason: gcc and g++ that ns3.apt_snapshot installs for build-essential on the base image. SimAI asks for 9.4 or newer with C++17.
    source: g++ --version in the probe container (docs/milestones/evidence/m5/probe/02-simai-noble-inner.log)
  ns3.cmake:
    kind: observed
    value: 3.28.3-1build7
    reason: cmake from ns3.apt_snapshot. SimAI asks for 3.14 or newer. ninja is absent, as SimAI requires.
    source: dpkg-query in the probe container (docs/milestones/evidence/m5/probe/02-simai-noble-inner.log)
  ns3.python:
    kind: observed
    value: 3.12.3-0ubuntu2.1
    reason: python3 from ns3.apt_snapshot. It runs the ./ns3 build wrapper and SimAI's topology generator. SimAI asks for 3.8 or newer.
    source: dpkg-query in the probe container (docs/milestones/evidence/m5/probe/02-simai-noble-inner.log)
  ns3.resume_patch:
    kind: checksum
    value: sha256:ce82e9f1e3a3c5f79ed4b72f11194cdd19f5d9df994de00bd652739059d13cb3
    ref: images/ns3/qbb-resume-qp-lookup.patch
    reason: The one patch the image applies to ns3.ns3_alibabacloud. QbbNetDevice::Resume looked a QP up by priority index on
      every PFC RESUME and crashed a host with fewer QPs than that index. The patch moves the lookup under the node-type-2 test
      it serves. The user chose a patch over more QPs per host on 2026-11-16.
    source: sha256sum images/ns3/qbb-resume-qp-lookup.patch (docs/milestones/evidence/m6/patch-proof/patch-proof.txt)
  ns3.image:
    kind: image-digest
    value: sha256:da7a3245b1b91dd472d1ddb9497b3bd1abb3efdbaee38c45fe790dff565a61c6
    ref: rfl-ns3:m6
    reason: Built from images/ns3/Dockerfile inside ns3sim1 with ns3.resume_patch applied and the M6 rfl-star driver. A build
      after guest.sh clean, which deleted the tag, the base image and every BuildKit cache entry, gave this same manifest digest
      with no cached step. Every Track C scenario of M5 and M6 ran on it.
