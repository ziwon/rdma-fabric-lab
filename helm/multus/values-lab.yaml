# The daemon takes its default delegate from the directory Cilium writes to, cni.confPath of helm/cilium/values-lab.yaml.
# The upstream manifest mounts that host directory at the same path in the daemon's container, so the clusterNetwork
# path in 00-multus.conf names the same file on the node.
daemonConfig:
  multusAutoconfigDir: /etc/cni/multus/net.d
