# make addons sets both from cni.multus_image in versions.lock.yaml, the tag with its digest.
image:
  repository: ""
  tag: ""
# multusAutoconfigDir of the daemon config, as the daemon's container sees it. The daemon takes the first CNI file there
# as its default delegate. The default is the upstream value.
daemonConfig:
  multusAutoconfigDir: /host/etc/cni/net.d
